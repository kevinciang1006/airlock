# Airlock — local Supabase stack config (used by the Supabase CLI + CI).
project_id = "airlock"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email testing inbox (magic links / confirmations land here in dev).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Seeded demo users must be usable immediately — no confirmation step locally.
enable_confirmations = false

# Google OAuth is wired + documented but optional; disabled locally so the
# demo works without redirect configuration.
[auth.external.google]
enabled = false
